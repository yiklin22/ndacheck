name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fast tests only: no torch/transformers, the model-backed tests are marked slow.
      - run: pip install fastapi jinja2 python-multipart pdfplumber python-docx pytest httpx
      - run: pytest -q -m "not slow"
